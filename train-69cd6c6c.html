<meta name="robots" content="noindex,nofollow"><!-- 含問卷真實答案：不要從任何頁面連過來 -->
<title>人生列車</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Noto+Serif+TC:wght@400;900&family=Oswald:wght@500;600&display=swap">
<style>
:root{--bg:#0A0E1A;--ink:#E8E4DA;--muted:#8D93A5;--accent:#FFD58A;
  --serif:"Noto Serif TC","Songti TC",serif;--sans:"Noto Sans TC","PingFang TC",sans-serif;--cond:"Oswald","Arial Narrow",sans-serif;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);margin:0;padding:12px 16px;box-sizing:border-box;display:grid;grid-template-rows:1fr auto;gap:10px;place-items:center}
.stage{position:relative;width:min(100%,calc((100vh - 90px)*16/9));aspect-ratio:16/9;max-width:100%;container-type:inline-size;overflow:hidden;border-radius:6px;cursor:pointer;user-select:none}
.stage:fullscreen{width:100%;border-radius:0;background:#000}
.stage>svg{display:block;width:100%;height:100%}
.s-serif{font-family:var(--serif)}.s-sans{font-family:var(--sans)}.s-cond{font-family:var(--cond)}

/* 三種時段 */
.stage{--sky1:#A3D2EA;--sky2:#F4ECDA;--stars:0;--sun:#F6C667;--mtn1:#A7C4AE;--mtn2:#86AB90;--ground:#CDBF9F;--ballast:#7A6E60;--bright:1;--glow:0;--lit:0;--sink:#1E2A44;--sub:#4F5A70}
.stage[data-mode="dusk"]{--sky1:#3F3D72;--sky2:#F2A76A;--stars:.3;--sun:#F7B267;--mtn1:#6E5C80;--mtn2:#574B6E;--ground:#6A5A62;--ballast:#4E4248;--bright:.8;--glow:.7;--lit:.85;--sink:#FFF6E6;--sub:#F6DCC4}
.stage[data-mode="night"]{--sky1:#0B1733;--sky2:#2B3D68;--stars:1;--sun:#F4EBD0;--mtn1:#26345A;--mtn2:#1D2847;--ground:#1B2238;--ballast:#2A2A33;--bright:.5;--glow:1;--lit:1;--sink:#F4EAD2;--sub:#AAB5D0}
.stage svg *{transition:fill 1.2s,stop-color 1.2s,opacity 1.2s,filter 1.2s}
.tint{filter:brightness(var(--bright))}
.ptint{filter:brightness(calc(.45 + var(--bright)*.55))} /* 人物夜裡不要太暗，電視上才看得清 */
.moving .far{animation:scroll 9s linear infinite}
.moving .near{animation:scroll 5s linear infinite}
.moving .sleep{animation:sleep .25s linear infinite}
@keyframes scroll{to{transform:translateX(-1200px)}}
@keyframes sleep{to{transform:translateX(-36px)}}
#caption{transition:opacity .5s}
.fresh{animation:board 1s both}
@keyframes board{0%{opacity:0}40%{opacity:1}55%{opacity:.4}100%{opacity:1}}

/* 疊加層：封面與車票 */
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(6,10,24,.6);transition:opacity .5s}
.overlay.off{opacity:0;pointer-events:none}
.cover{text-align:center;color:#F4EAD2}
.cover h1{font-family:var(--serif);font-weight:900;font-size:9cqw;margin:0;letter-spacing:.08em}
.cover p{margin:.6em 0 0;font-size:2.2cqw;color:#D8CFBC}
.cover .go{margin-top:2.4em;font-family:var(--cond);font-size:1.6cqw;letter-spacing:.3em;color:var(--accent)}
.ticket{width:72cqw;height:auto;filter:drop-shadow(0 1.2cqw 2cqw rgba(0,0,0,.45))}
.ticket [hidden]{display:none}
#stubQ,#stubA{transition:opacity .6s}
.torn #stubQ{opacity:0}.torn #stubA{opacity:1}
#stubA{opacity:0}
.torn #stub{animation:tear .7s ease-out}
@keyframes tear{30%{transform:translate(14px,-6px) rotate(4deg)}100%{transform:none}}

.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:14px;color:var(--muted)}
.bar button{font:inherit;color:var(--ink);background:#1B2133;border:1px solid #2E364D;border-radius:999px;padding:5px 14px;cursor:pointer}
.bar button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar select{font:inherit;color:var(--ink);background:#1B2133;border:1px solid #2E364D;border-radius:999px;padding:4px 10px;max-width:16em}
.bar kbd{font-family:var(--cond);background:#1B2133;border:1px solid #2E364D;border-radius:4px;padding:0 6px;color:var(--ink)}
#prog{font-family:var(--cond);letter-spacing:.1em;min-width:4.5em;text-align:center}
/* 互動遊戲：秘密乘客調查（票根封面 → 題目 → 人頭剪影揭曉） */
#gameTicket{width:72cqw;filter:drop-shadow(0 1.2cqw 2cqw rgba(0,0,0,.45))}
#gStub{transform-box:fill-box;transform-origin:0 100%;transition:transform .8s cubic-bezier(.5,0,.8,.4),opacity .8s}
.torn #gStub{transform:translate(40px,120px) rotate(28deg);opacity:0}
.blink{animation:blink 1.6s ease-in-out infinite}@keyframes blink{50%{opacity:.35}}
#ovQuiz{place-items:stretch;background:linear-gradient(#0B1733,#2B3D68)}
#quiz{position:relative;display:grid;grid-template-rows:auto 1fr auto;padding:2.2cqw 3cqw 1.6cqw;gap:1.2cqw;color:#F4EAD2;min-height:0}
#qbar{display:flex;align-items:baseline;gap:1.6cqw;background:#1D3F7A;border-radius:.6cqw;padding:1cqw 2cqw;box-shadow:0 .4cqw 0 #12294F}
#qid{font-family:var(--cond);font-weight:600;font-size:2.6cqw;color:var(--accent);letter-spacing:.1em}
#qtext{font-family:var(--serif);font-weight:900;font-size:3.4cqw;letter-spacing:.06em}
#qbody{display:flex;flex-direction:column;justify-content:center;min-height:0}
#qrows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;justify-content:center;gap:var(--gap,1.4cqw);min-height:0}
#qrows li{display:grid;grid-template-columns:1fr calc(var(--n,3)*(var(--hs) + .6cqw));align-items:center;gap:2cqw;animation:qslide .5s both}
@keyframes qslide{from{opacity:0;transform:translateX(-4cqw)}}
.ans{background:#F4EAD2;color:#3A1F1A;border-left:.8cqw solid #B3261E;border-radius:.4cqw;padding:.7cqw 1.6cqw;font-weight:900;font-size:var(--fs);line-height:1.35}
.who{display:flex;gap:.6cqw}
.who button{all:unset;cursor:pointer;position:relative;width:var(--hs);aspect-ratio:13/11;border-radius:.6cqw;background:#ffffff10;display:grid;place-items:center}
.who button:focus-visible{outline:.25cqw solid var(--accent)}
.who svg{width:100%;height:100%}
.who .face{opacity:0;transition:opacity .5s}.who .shadow{transition:opacity .5s}
.who .on .face{opacity:1}.who .on .shadow{opacity:0}
.who .q{position:absolute;font-family:var(--cond);font-size:calc(var(--hs)*.34);color:#C9D2EA;top:28%;transition:opacity .3s}.who .on .q{opacity:0}
.who .tg{position:absolute;bottom:-.4cqw;left:50%;transform:translate(-50%,40%) scale(.6);opacity:0;white-space:nowrap;font-size:calc(var(--hs)*.24);font-weight:700;color:#fff;border:.12cqw solid #fff;border-radius:99px;padding:.05cqw .7cqw;transition:.35s}
.who .on .tg{opacity:1;transform:translate(-50%,40%)}
#qcap{min-height:2.6cqw;text-align:center;font-size:1.9cqw;color:var(--accent)}#qcap b{color:#fff}
.hero{display:flex;align-items:flex-end;gap:2.5cqw;padding-left:2cqw;height:100%}
.hero svg{height:min(100%,36cqw);animation:qslide .6s both}
.heroName{font-family:var(--serif);font-weight:900;font-size:10cqw;letter-spacing:.12em;color:#F4EAD2;align-self:center;text-shadow:0 .5cqw 0 #B3261E;animation:qpop .5s .4s both}
.hero.still svg,.hero.still .heroName{animation:none} /* 新角色那頁：主角不重播進場 */
.cameo{position:absolute;right:3cqw;bottom:1.5cqw;display:flex;flex-direction:column;align-items:flex-end;animation:qjump .9s cubic-bezier(.3,1.4,.5,1) both}
.cameo svg{height:20cqw;margin-right:4cqw;filter:drop-shadow(0 0 .5cqw #9FB4E8)}
.ctag{margin:-.4cqw 2cqw 0 0;background:#B3261E;color:#fff;font-weight:900;font-size:1.7cqw;border:.15cqw solid #fff;border-radius:99px;padding:.15cqw 1.2cqw}
.cbubble{position:relative;width:29cqw;margin-bottom:1.4cqw;background:#F4EAD2;color:#3A1F1A;border-radius:1.6cqw;padding:1.4cqw 2cqw;font-size:2.4cqw;font-weight:700;line-height:1.5;box-shadow:0 .6cqw 1.4cqw rgba(0,0,0,.35);animation:qpop .45s 1s both}
.cbubble::after{content:"";position:absolute;top:100%;right:8cqw;border:1.2cqw solid transparent;border-top-color:#F4EAD2}
@keyframes qjump{from{transform:translate(30cqw,25cqw) rotate(25deg);opacity:0}60%{opacity:1}}
@keyframes qpop{from{opacity:0;transform:translateY(1cqw) scale(.9)}}
/* 人偶動作：招手（左手臂繞肩膀轉）、搖頭（頭繞脖子轉）、嬰兒上下跳 */
.wave .arm{animation:wave 2.6s ease-in-out 1.2s infinite}
.shake .arm{animation:wave 2.2s ease-in-out .6s infinite}
.shake .hb,.shake .hf{animation:shake 2.2s ease-in-out .6s infinite}
.bounce .ptint>*{animation:bounce .9s ease-in-out 1.2s infinite}
@keyframes wave{0%,80%,100%{transform:none}14%,38%,62%{transform:rotate(118deg)}26%,50%{transform:rotate(96deg)}72%{transform:rotate(108deg)}} /* 手舉到肩膀高度往外揮；超過約 125 度手會跑到大頭後面 */
@keyframes shake{0%,70%,100%{transform:none}10%,30%,50%{transform:rotate(-9deg)}20%,40%,60%{transform:rotate(9deg)}}
@keyframes bounce{0%,100%{transform:none}50%{transform:translateY(-12px)}}
@media (prefers-reduced-motion:reduce){.stage svg *,.overlay,#caption{transition:none}.moving .far,.moving .near,.moving .sleep,.torn #stub,.fresh,.blink,#qrows li,.hero svg,.heroName,.cameo,.cbubble,.wave .arm,.shake .arm,.shake .hb,.shake .hf,.bounce .ptint>*{animation:none}#gStub{transition:none}}
</style>

function car(sym,x,wins,w,style='',fresh=[],tag=null){ // 一節車廂；wins＝亮著的窗（1 起算）；fresh＝這一步新亮的窗；tag＝新乘客名牌
  let h=`<g class="tint"><use href="#${sym}" x="${x}" y="${Y}" width="${w*S}" height="${110*S}" style="${style}"/></g>`,g='',r='',t='';
  for(const n of wins){const i=n-1,wx=x+(30+32*i)*S,wy=Y+38*S,k=fresh.indexOf(n),cls=k<0?'':` class="fresh" style="animation-delay:${k*Math.min(.12,.8/fresh.length)*T}s"`;
    r+=`<rect${cls} x="${wx}" y="${wy}" width="${26*S}" height="${24*S}" rx="2"/>`;
    g+=`<rect${cls} x="${wx-8}" y="${wy-8}" width="${26*S+16}" height="${24*S+16}" rx="8"/>`;
    const tl=[].concat(tag||[]),ti=tl.findIndex(o=>o.seat===n),tg=tl[ti];if(tg){const cx=wx+13*S,tw=Math.max(72,tg.name.length*18+16),dy=ti*36;t+=`<g class="fresh" style="animation-delay:${k*Math.min(.12,.8/fresh.length)*T}s"><rect x="${cx-tw/2}" y="${Y-30-dy}" width="${tw}" height="30" rx="15" fill="#FFD58A"/><path d="M${cx-7} ${Y-dy} L${cx} ${Y+9-dy} L${cx+7} ${Y-dy}Z" fill="#FFD58A"/><text x="${cx}" y="${Y-9-dy}" text-anchor="middle" class="s-sans" font-size="17" font-weight="900" fill="#1E2A44">${tg.name}</text></g>`}}

}

// 頭上名牌：依造型代號判斷是誰，底色用家族色
const PU='#8A62A8',CY='#1F7FA3',GR='#6E9228'; // 怡婷家粉紫、偉立家青藍、LOLO 家黃綠（名牌底色）
const WHO=[[/^(dad|groom)/,'爸爸','#2B4A7E'],[/^(mom|bride)/,'媽媽','#8E2A3A'],[/^yt/,'怡婷',PU],[/^hy/,'翰毅',PU],[/^pdw/,'培典老婆',PU],[/^pd/,'培典',PU],[/^py/,'培元',PU],

function nameTag(k,x,feet=500,ps=PS,lift=0,below=false){const w=WHO.find(([re])=>re.test(k));if(!w)return'';const sp=SPEC(k),H=sp.stage==='baby'?80:STAGES[sp.stage].H,
  top=feet-(H+18)*ps-lift,tw=w[1]==='LOLO'?42:w[1].length*13+10;
  if(below)return `<g class="ptint"><rect x="${x-tw/2}" y="${feet+4}" width="${tw}" height="22" rx="11" fill="${w[2]}" stroke="#FFFFFF" stroke-width="1.5"/><text x="${x}" y="${feet+20}" text-anchor="middle" class="s-sans" font-size="13" font-weight="700" fill="#FFFFFF">${w[1]}</text></g>`;
  return `<g class="ptint"><rect x="${x-tw/2}" y="${top-26}" width="${tw}" height="22" rx="11" fill="${w[2]}" stroke="#FFFFFF" stroke-width="1.5"/><path d="M${x-5} ${top-4} L${x} ${top+2} L${x+5} ${top-4}Z" fill="${w[2]}"/><text x="${x}" y="${top-10}" text-anchor="middle" class="s-sans" font-size="13" font-weight="700" fill="#FFFFFF">${w[1]}</text></g>`}
const SEAT={dad:1,mom:2,yt:3,wl:4,lolo:5,hy:6,py:7,pd:8,mz:9,jk:10,jd:11,sj:12,zc:13,zj:14,pdw:15};
const winX=n=>500+(43+32*(n-1))*S; // 長車廂第 n 扇窗的中心 x
function person(k,x,feet,ps,f,t,extra,tag){return `<g data-k="${k}" data-x="${x}" data-from="${f}" data-to="${t}"${extra}><g class="ptint" transform="translate(${x-60*ps} ${feet-210*ps}) scale(${ps})">${fig(SPEC(k))}</g>${tag}</g>`}
function platHTML(s){
  const P=s.plat||[];let out='';
  const fx=k=>{const w=WHO.find(([re])=>re.test(k));return w&&NEWNAMES[s.key]?.includes(w[1])?(SPEC(k).stage==='baby'?' class="bounce"':' class="wave"'):''}; // 新成員：嬰兒上下跳、大人招手
  if(Array.isArray(P)){ // 舊式：全部站在車站前的月台
    P.forEach(([k,x,from,to,pop])=>{const f=`translateX(${(from??DOOR)-x}px)`,t=`translateX(${(to??from??DOOR)-x}px)`;
      out+=person(k,x,500,PS,f,t,(pop?' data-pop="1"':'')+fx(k),s.tags?nameTag(k,x):'')});return out}
  const B=P.back||[],F=P.front||[],nb=B.length,psb=nb>6?.52:PS,gb=Math.min(58,285/((nb-1)||1)),xb=nb>1?327.5-gb*(nb-1)/2:330;
  if(F.length)out+=`<g class="tint" data-strip="1"><rect x="0" y="596" width="1200" height="79" fill="#D9CDB4"/><rect x="0" y="596" width="1200" height="5" fill="#E8C14A"/></g>`;
  B.forEach(([k,pop],i)=>{const x=xb+gb*i,f=`translateX(${DOOR-x}px)`; // 後方：從車門走出來
    out+=person(k,x,500,psb,f,f,(pop?' data-pop="1"':'')+fx(k),s.tags?nameTag(k,x,500,psb,nb>6&&i%2?22:0):'')});
  const PF=PS*1.5,gf=86, // 間距＝人偶最寬處（頭紗、頭髮），靠近但不重疊
  xf=600-gf*(F.length-1)/2;
  F.forEach(([k,pop],i)=>{const x=xf+gf*i,id=k.split(/[@!]/)[0],f=`translate(${winX(SEAT[id])-x}px,-110px)`; // 前方：從自己的窗下來
    out+=person(k,x,648,PF,f,f,' data-grp="front"'+(pop?' data-pop="1"':'')+fx(k),s.tags?nameTag(k,x,648,PF,0,true):'')});
  return out}

  C01:{text:'剛加入這一家時，「原來他們家是這樣相處的」',rows:[['養狗',[['hy','']]],['原來 LOLO 在家講話這麼有恃無恐',[['mz','']]]]},
  C02a:{id:'C02',text:'第一次見到爸爸，覺得他是什麼樣的人？',rows:[['正派',[['hy','現在有沒有改變？沒有']]],['在外面很有威嚴，一回到家就被女兒吃定的寵女老爸',[['mz','現在有沒有改變？沒']]]]},
  C02b:{id:'C02',text:'第一次見到媽媽，覺得她是什麼樣的人？',rows:[['賢慧',[['hy','']]],['有智慧、很聰明、廚藝好——選她女兒就對了 ❤️',[['mz','']]]]},
  C03:{text:'爸爸媽媽有沒有一種很固定的相處模式？',rows:[['爸爸講爸爸的話，媽媽做媽媽的事',[['hy','']]],['夫唱婦隨',[['mz','']]]]},
  C04:{text:'加入這個家之後，發現這一家特別重要的事',rows:[['節日聚會',[['hy','']]],['包容尊重',[['mz','']]]]},
  D05:{text:'只有跟阿公阿嬤在一起，才會發生的事',rows:[
    ['阿公會自己到處走走看看，讓阿嬤找不到',[['pd','']]],
    ['阿公可以吃到阿嬤切好的水果',[['zj','']]],
    ['阿公開始講很長很長的故事，然後舅舅奶奶都會白眼阿公，然後偷偷講「又來了」',[['jd','']]],
    ['打麻將',[['jk','']]],
    ['喝地下室珍藏的高級酒',[['py','']]]]},
  D06:{text:'偷偷爆料阿公阿嬤一件事',rows:[['阿公的蚊子六親不認',[['jk','']]],['阿嬤的床很舒服，阿公的床太硬了',[['zj','']]]]},
  B08:{text:'三個孩子裡，誰最不聽話？',hero:'lolo',name:'怡菁',cameo:{id:'hy',say:'阿菁最不聽話，但是聚會安排總有比爸爸更好的建議與安排'}} // 主角大人偶；下一頁新角色（姐夫，剪影）從右下角跳入
};
const nameOf=id=>WHO.find(([re])=>re.test(id));
// 人頭剪影：同一張人偶畫兩層，上層塗成剪影色（不畫道具，免得一眼被認出），揭曉時淡出
const bust=(id,i)=>{const sp=LOOK(id,2026);return `<svg viewBox="-6 36 132 112" aria-hidden="true"><defs><filter id="sil${i}"><feFlood flood-color="#3A4566"/><feComposite in2="SourceAlpha" operator="in"/></filter></defs>
  <g class="face">${fig(sp)}</g><g class="shadow" filter="url(#sil${i})">${fig(sp,['body','bottom','top','hair','acc'])}</g></svg>`};
function quiz(s){
  if(s.ov==='ovGame'){$('gStop').textContent=s.stop;$('gameTicket').classList.remove('torn');return}
  if(s.ov!=='ovQuiz')return;
  const q=QS[s.q];let k=0;
  $('qid').textContent=q.id||s.q;$('qtext').textContent=q.text;$('qcap').textContent='';
  if(q.hero){const c=q.cameo;
    $('qbody').innerHTML=`<div class="hero${s.cameo?' still':''}"><svg class="shake" viewBox="-10 40 140 175" aria-hidden="true">${fig(LOOK(q.hero,2026))}</svg><div class="heroName">${q.name}</div></div>`+(s.cameo?
      `<div class="cameo"><div class="cbubble">${c.say}</div><svg viewBox="-10 40 140 175" aria-hidden="true"><defs><filter id="silC"><feFlood flood-color="#0E1630"/><feComposite in2="SourceAlpha" operator="in"/></filter></defs><g filter="url(#silC)">${fig(LOOK(c.id,2026),['body','bottom','top','hair','acc'])}</g></svg><span class="ctag">新角色登場</span></div>`:'');
    return}
  const n=q.rows.length;
  const B=$('qbody');B.style.cssText=`--fs:${n<2?4.4:n<4?3:n>7?2.1:n>6?2.3:2.6}cqw;--hs:${n<2?9:n<4?7.5:n>7?4.4:n>6?5.2:5.8}cqw;--gap:${n>5?.6:1.4}cqw;--n:${Math.max(...q.rows.map(r=>r[1].length))}`;
  B.innerHTML=`<ol id="qrows">${q.rows.map(([a,ps],r)=>`<li style="animation-delay:${r*.15}s"><div class="ans">${a}</div><div class="who">${ps.map(([id,note])=>{const [,nm,c]=nameOf(id);
      return `<button type="button" data-nm="${nm}" data-note="${note}" aria-label="揭曉是誰寫的">${bust(id,k++)}<span class="q">?</span><span class="tg" style="background:${c}">${nm}</span></button>`}).join('')}</div></li>`).join('')}</ol>`;
}
$('ovQuiz').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;e.stopPropagation(); // 點剪影＝揭曉，不翻頁
  b.classList.add('on');b.setAttribute('aria-label',b.dataset.nm);$('qcap').innerHTML=`<b>${b.dataset.nm}</b>${b.dataset.note?'：'+b.dataset.note:''}`});

let cur=0,busy=false;
const setProg=()=>{$('prog').textContent=`${cur+1} / ${STEPS.length}`;$('jump').value=cur;history.replaceState(null,'','#p'+(cur+1))};
async function next(){
  if(busy||cur>=STEPS.length-1)return;
  const a=STEPS[cur],b=STEPS[++cur];setProg();
  if(a.key===b.key&&(b.enter||b.grow||b.arrive)){
    busy=true;const kids=people,A=(el,k,o)=>el.animate(k,{duration:o.d*T,delay:(o.w||0)*T,easing:o.e||'ease-out',fill:'forwards'}).finished;
    if(b.enter){                       // 旁邊滑進第二個車站，新人物淡入
      paint(b);const old=new Set(a.plat.map(p=>p[0]));
      await Promise.all([A($('stns').querySelector('[data-slot="1"]'),[{transform:'translateX(500px)',opacity:0},{transform:'none',opacity:1}],{d:1200}),
        ...kids().filter(g=>!old.has(g.dataset.k)).map(g=>A(g,[{opacity:0,transform:'translateY(12px)'},{opacity:1,transform:'none'}],{d:600,w:1000}))]);
    }else if(b.grow){                  // 寶寶淡出，長大後的樣子淡入
      await Promise.all(kids().map(g=>A(g,[{opacity:1},{opacity:0}],{d:500})));
      paint(b);await Promise.all(kids().map(g=>A(g,[{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],{d:800})));
    }else{                             // 列車開進來 → 人走進車門 → 窗亮
      setCap(b);$('plat').innerHTML=platHTML({plat:[...b.plat,...b.boarders]});
      train.innerHTML=TRAINS[b.train]({...b,on:a.on,fresh:[]});
      await A(train.querySelector(`[data-t="${b.arrive}"]`),(b.arrive==='dad'?[{transform:'translateX(-900px)'},{transform:'none'}]:[{transform:'translateX(-420px)',opacity:0},{opacity:1,offset:.35},{transform:'none',opacity:1}]),{d:1800});
      const bk=new Set(b.boarders.map(p=>p[0]));
      await Promise.all(kids().filter(g=>bk.has(g.dataset.k)).map(g=>A(g,[{transform:'translateX(0)',opacity:1},{opacity:1,offset:.7},{transform:g.dataset.to,opacity:0}],{d:1100,e:'ease-in'})));
      paint(b);
    }
    busy=false;return}
  if(a.key===b.key&&b.board){          // 上車：月台的人走進車門，窗戶一扇扇亮起
    busy=true;
    const ppl=people(),off=g=>b.approach?.[g.dataset.k]!=null?b.approach[g.dataset.k]-g.dataset.x:0;
    if(b.approach)await Promise.all(ppl.map(g=>g.animate([{transform:'none'},{transform:`translateX(${off(g)}px)`}],{duration:1200*T,easing:'ease-in-out',fill:'forwards'}).finished));
    await Promise.all(ppl.map((g,i)=>g.animate([{transform:`translateX(${off(g)}px)`,opacity:1},{opacity:1,offset:.7},{transform:g.dataset.to,opacity:0}],{duration:1300*T,delay:0,easing:'ease-in',fill:'forwards'}).finished));
    if(strip())await strip().animate([{opacity:1},{opacity:0}],{duration:400*T,fill:'forwards'}).finished;
    if(a.train==='meet'&&b.train==='together') // 紅色列車由左往右開走
      await train.querySelector('[data-t="mom"]').animate([{transform:'none'},{transform:'translateX(500px)',opacity:0}],{duration:1600*T,easing:'ease-in',fill:'forwards'}).finished;
    paint(b);busy=false;return}
  if(a.ov==='ovGame'&&b.ov==='ovQuiz'){busy=true;$('gameTicket').classList.add('torn');await wait(800);paint(b);busy=false;return} // 撕票根 → 遊戲開始
  if(a.key===b.key){paint(b);return}   // 同一站：只換疊加層
  busy=true;                          // 轉場：車站滑出 → 換時段與列車 → 新車站滑入
  for(const id of OVS)$(id).classList.add('off');
  cap.style.opacity=0;
  stage.classList.add('moving');
  if(NEWBIE.has(b.key))stage.dataset.mode='night'; // 夜晚 → 進站時天亮
  if(a.st)await slide(stnMove,'translateX(0)','translateX(-1400px)',1100,'ease-in');else await wait(500);
  if(a.train!==b.train){train.animate([{opacity:1},{opacity:0}],{duration:350*T,fill:'forwards'});await wait(350)}
  paint(b.alight?{...b,on:a.on,plat:[]}:b);cap.style.opacity=0;
  if(a.train!==b.train)train.animate([{opacity:0},{opacity:1}],{duration:500*T,fill:'forwards'});
  if(b.st)await slide(stnMove,'translateX(1400px)','translateX(0)',1300,'ease-out');else await wait(1400);
  stage.classList.remove('moving');
  cap.style.opacity=1;
  if(b.alight){
    $('plat').innerHTML=platHTML(b);train.innerHTML=TRAINS[b.train](b);
    const ppl=people(),pop=ppl.filter(g=>g.dataset.pop),back=ppl.filter(g=>!g.dataset.pop&&g.dataset.grp!=='front'),front=ppl.filter(g=>!g.dataset.pop&&g.dataset.grp==='front');
    const sb=Math.min(500,2500/(back.length||1)),t1=front.length?(back.length?(back.length-1)*sb+900:0):0,t2=t1+(front.length?(front.length-1)*400+900:(back.length-1)*sb+900);
    const IN=(g,d)=>g.animate([{transform:g.dataset.from,opacity:0},{opacity:1,offset:.2},{transform:'none',opacity:1}],{duration:1300*T,delay:d*T,easing:'ease-out',fill:'both'}).finished;
    if(strip())strip().animate([{opacity:0},{opacity:1}],{duration:600*T,delay:t1*T,fill:'both'});
    await Promise.all([...back.map((g,i)=>IN(g,i*sb)),...front.map((g,i)=>IN(g,t1+i*400)),
      ...pop.map(g=>g.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],{duration:700*T,delay:t2*T,fill:'both'}).finished)]);
  }
  busy=false;
}
function go(n){ // 直接跳到第 n 步（0 起算），不播轉場
  if(busy||n<0||n>=STEPS.length)return;cur=n;setProg();
  stnMove.getAnimations().forEach(x=>x.cancel());paint(STEPS[cur]);
}
const back=()=>go(cur-1); // 往回一律直接跳，不播轉場
// 跳頁選單（測試用）：選項文字＝頁碼＋那一頁在做什麼；網址 #p23 可直接開在第 23 頁
const OVNAME={ // 跳頁選單用
ovCover:'封面',ovBlue:'藍票',ovRed:'紅票範例',ovGame:'遊戲票根'};
$('jump').innerHTML=STEPS.map((s,i)=>`<option value="${i}">${i+1}．${s.q?'遊戲 '+s.q:OVNAME[s.ov]||(s.year+' '+s.title)}</option>`).join('');
$('jump').addEventListener('change',e=>{go(+e.target.value);e.target.blur()});


addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT')return; // 在跳頁選單裡用方向鍵選頁，不要同時翻頁
  if(e.target.closest?.('#ovQuiz button')&&(e.key===' '||e.key==='Enter'))return; // 鍵盤操作剪影時不翻頁
  if(['ArrowRight',' ','PageDown','Enter'].includes(e.key)){e.preventDefault();next()}
  else if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();back()}
  else if(e.key==='f'||e.key==='F'){(document.fullscreenElement?document.exitFullscreen():stage.requestFullscreen?.())?.catch?.(()=>{})}
});
stage.addEventListener('click',next);
$('bNext').addEventListener('click',next);
$('bPrev').addEventListener('click',back);
// 山景複製一份接在右邊，捲動才會無縫（用實體複本，顏色轉場才會同步）
for(const id of ['farP','nearP']){const c=$(id).cloneNode();c.removeAttribute('id');c.setAttribute('transform','translate(1200 0)');$(id).after(c)}
go(Math.min(STEPS.length,Math.max(1,+location.hash.match(/^#p(\d+)$/)?.[1]||1))-1);
</script>
