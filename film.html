      a1=-2*c/a0;a2=(1-al)/a0;};
    const dyn=typeof fc=='function';set(dyn?fc(0):fc);
    for(let i=0;i<N;i++){if(dyn&&!(i&255))set(fc(i/SR));const x=buf[i],y=b0*x+b1*x1+b2*x2-a1*y1-a2*y2;x2=x1;x1=x;y2=y1;y1=y;buf[i]=y;}
  }
  biquad(bus.PAD,'lowpass',1100);biquad(bus.STR,'lowpass',2600);biquad(bus.CHG,'bandpass',2400);biquad(bus.WHS,'lowpass',1900);biquad(bus.SWL,'highpass',4500);
  biquad(bus.RUM,'lowpass',t=>t<10.5?120*Math.pow(15,t/10.5):Math.max(150,1800*Math.pow(1/12,(t-10.5)/2)));
  const WET={BOX:.5,BELL:.7,PAD:.5,STR:.55,BASS:.05,PLK:.35,CHG:.1,DRY:.1,WHS:.8,SWL:.7,RUM:.1}, dry=new Float32Array(N), send=new Float32Array(N);
  for(const k in bus){const b=bus[k],w=WET[k];for(let i=0;i<N;i++){dry[i]+=b[i];send[i]+=b[i]*w;}}
  function reverb(sp){const o=new Float32Array(N);
    for(const d0 of[1557,1617,1491,1422,1277,1356]){const d=d0+sp,b=new Float32Array(d);let k=0,st=0;for(let i=0;i<N;i++){const y=b[k];st=y*.8+st*.2;b[k]=send[i]+st*.86;o[i]+=y;if(++k==d)k=0;}}
    for(const d0 of[225,556,441,341]){const d=d0+sp,b=new Float32Array(d);let k=0;for(let i=0;i<N;i++){const y=b[k],x=o[i];b[k]=x+y*.5;o[i]=y-x;if(++k==d)k=0;}}
    return o;}
  const rms=a=>{let q=0;for(let i=0;i<N;i+=7)q+=a[i]*a[i];return Math.sqrt(q/(N/7));};
  const out=new AudioBuffer({length:N,numberOfChannels:2,sampleRate:SR}), wets=[reverb(0),reverb(23)], wg=.34*rms(dry)/rms(wets[0]);
  let pk=0; for(let i=0;i<N;i++)pk=Math.max(pk,Math.abs(dry[i]+wets[0][i]*wg));
  wets.forEach((w,c)=>{const g=1.25/pk;for(let i=0;i<N;i++){const t=i/SR;w[i]=Math.tanh((dry[i]+w[i]*wg)*g)*.9*(t<164.5?1:Math.max(0,1-(t-164.5)/5.5));}out.copyToChannel(w,c);});
  return out;
}

/* ───────── 播放器 ───────── */
const $=id=>document.getElementById(id), gate=$('gate'), go=$('go'), bar=$('bar'), seekEl=$('seek'), timeEl=$('time'), pp=$('pp'), recBtn=$('rec');
let music, actx, src, playing=false, t0=0, c0=0, rec=null, recDest=null;
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
const now=()=>playing?cl(t0+actx.currentTime-c0,0,DUR):t0;
function play(){
  if(!music)return; actx??=new AudioContext(); actx.resume();
  if(t0>=DUR)t0=0;
  src=actx.createBufferSource();src.buffer=music;src.connect(actx.destination);if(recDest)src.connect(recDest);
  src.start(0,t0);c0=actx.currentTime;playing=true;pp.textContent='⏸';gate.hidden=true;bar.hidden=false;
}
function pause(){if(!playing)return;t0=now();src.stop();playing=false;pp.textContent='▶';}
function seek(t){const p=playing;pause();t0=cl(t,0,DUR);if(p)play();else render(t0);}
function loop(){
  const t=now();
  if(playing||loop.last!==t){render(t);loop.last=t;seekEl.value=t;timeEl.textContent=fmt(t)+' / '+fmt(DUR);}
  if(playing&&t>=DUR){pause();if(rec&&rec.state=='recording')rec.stop();}
  requestAnimationFrame(loop);
}
function record(){
  if(rec&&rec.state=='recording'){rec.stop();return;}
  actx??=new AudioContext();pause();recDest=actx.createMediaStreamDestination();
  const stream=out.captureStream(30);stream.addTrack(recDest.stream.getAudioTracks()[0]);
  const mime=['video/mp4;codecs=avc1.640028,mp4a.40.2','video/webm;codecs=vp9,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m)),chunks=[];
  rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:14e6});
  rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(chunks,{type:mime}));a.download='鑽石婚號.'+(mime.includes('mp4')?'mp4':'webm');a.click();recBtn.textContent='⏺ 錄成影片檔';recDest=null;};
  rec.onerror=e=>{alert('錄影失敗：'+(e.error?.message||e.type));recBtn.textContent='⏺ 錄成影片檔';};
  rec.start(1000);recBtn.textContent='⏹ 錄影中（播完自動存檔）';t0=0;play();
}
go.onclick=play; pp.onclick=()=>playing?pause():play(); recBtn.onclick=record;
seekEl.oninput=()=>seek(+seekEl.value);
$('fs').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
addEventListener('keydown',e=>{if(e.target.tagName=='INPUT')return;
  if(e.code=='Space'){e.preventDefault();playing?pause():play();}
  if(e.key=='f'||e.key=='F')$('fs').click();
  if(e.key=='ArrowRight')seek(now()+5); if(e.key=='ArrowLeft')seek(now()-5);});
let idle;addEventListener('pointermove',()=>{bar.classList.remove('idle');clearTimeout(idle);idle=setTimeout(()=>playing&&bar.classList.add('idle'),2500);});
const h=+(location.hash.match(/t=([\d.]+)/)||[])[1]; if(h)t0=cl(h,0,DUR);
render(t0); requestAnimationFrame(loop);
setTimeout(()=>buildMusic().then(b=>{music=window.music=b;go.disabled=false;go.textContent='▶ 播放';})
  .catch(e=>{go.textContent='配樂合成失敗：'+e.message;console.error(e);}),50);
</script>
